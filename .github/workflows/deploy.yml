name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Static Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run lint

      - name: Build production bundle
        env:
          NODE_ENV: production
          RAW_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$RAW_BASE_PATH" ]; then
            export VITE_BASE_PATH=$(echo "${RAW_BASE_PATH}/" | sed 's://*:/:g')
          elif [ "$REPO_NAME" = "${REPO_OWNER}.github.io" ]; then
            export VITE_BASE_PATH="/"
          elif [ -n "$REPO_NAME" ]; then
            export VITE_BASE_PATH="/${REPO_NAME}/"
          else
            export VITE_BASE_PATH="./"
          fi
          echo "Building with VITE_BASE_PATH=$VITE_BASE_PATH"
          npm run build
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
